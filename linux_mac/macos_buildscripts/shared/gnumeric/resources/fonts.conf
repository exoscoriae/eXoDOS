<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Minimal fontconfig configuration for the portable Gnumeric.app bundle.
     Points at the standard macOS font locations and keeps the cache in the
     user's Caches directory. -->
<fontconfig>
	<dir>/System/Library/Fonts</dir>
	<dir>/System/Library/Fonts/Supplemental</dir>
	<dir>/Library/Fonts</dir>
	<dir>~/Library/Fonts</dir>
	<cachedir>~/Library/Caches/org.gnumeric.Gnumeric/fontconfig</cachedir>

	<!-- sensible aliases so generic families resolve on macOS -->
	<alias>
		<family>serif</family>
		<prefer><family>Times New Roman</family><family>Times</family></prefer>
	</alias>
	<alias>
		<family>sans-serif</family>
		<prefer><family>Helvetica Neue</family><family>Helvetica</family><family>Arial</family></prefer>
	</alias>
	<alias>
		<family>monospace</family>
		<prefer><family>Menlo</family><family>Monaco</family><family>Courier New</family></prefer>
	</alias>
</fontconfig>
